name: Automated builds

on:
  push:
    paths:
      - "images/**"
      - ".github/workflows/*"
  pull_request: # They will only build the containers, not push them to our registry
    paths:
      - "images/**"
      - ".github/workflows/*"
    types:
      - opened
      - edited
      - ready_for_review
      - review_requested
      - reopened
#  schedule:
#    - cron: "0 0 * * *" # nightly

jobs:
  base:
    uses: ./.github/workflows/docker-build-and-publish.yml
    with:
      image_name: "base"
    secrets: inherit

  base-app:
    needs: [base]
    strategy:
      matrix:
        platform:
          - arch: "linux/amd64"
            runner: "ubuntu-latest"
          - arch: "linux/arm64"
            runner: "ARM64"
    uses: ./.github/workflows/docker-build-and-publish.yml
    with:
      image_name: "base-app"
      base_image: "${{ needs.base.outputs.image_tag }}"
      platforms: "${{ matrix.platform.arch }}"
      runs-on: "${{ matrix.platform.runner }}"
    secrets: inherit

  apps:
    needs: [base, base-app]
    strategy:
      matrix:
        include:
          - name: xorg
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: pulseaudio
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: udevd
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: sunshine
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: retroarch
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: firefox
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: firefox
            platform: "linux/arm64"
            runner: "ARM64"
          - name: steam
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: pegasus
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: lutris
            platform: "linux/amd64"
            runner: "ubuntu-latest"
          - name: heroic-games-launcher
            platform: "linux/amd64"
            runner: "ubuntu-latest"
      fail-fast: false
    uses: ./.github/workflows/docker-build-and-publish.yml
    with:
      image_name: "${{ matrix.name }}"
      base_image: "${{ needs.base.outputs.image_tag }}"
      base_app_image: "${{ needs.base-app.outputs.image_tag }}"
      platforms: "${{ matrix.platform }}"
      runs-on: "${{ matrix.runner }}"
    secrets: inherit
